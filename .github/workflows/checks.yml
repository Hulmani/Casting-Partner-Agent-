name: Foundation and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist casting-partner-agent
      - name: Smoke check installed entry point outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          casting-agent status
          casting-agent demo
      - uses: actions/upload-artifact@v4
        with:
          name: developer-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
