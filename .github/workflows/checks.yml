name: Foundation and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist casting-partner-agent
      - name: Smoke check installed entry point outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          casting-agent status
          casting-agent demo
      - uses: actions/upload-artifact@v4
        with:
          name: developer-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  native-macos-proof:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build clickable native prototype
        run: python -m casting_agent.build_desktop_app "$RUNNER_TEMP/Casting Partner Desktop Proof.app"
      - name: Check actual macOS permission status without requesting access
        run: '"$RUNNER_TEMP/Casting Partner Desktop Proof.app/Contents/MacOS/CastingDesktop" status'
      - name: Verify disallowed navigation is rejected before opening a browser
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          helper = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Casting Partner Desktop Proof.app/Contents/MacOS/CastingDesktop'
          result = subprocess.run([str(helper), 'open', 'https://example.com/'], capture_output=True, text=True)
          assert result.returncode == 2
          assert json.loads(result.stdout)['error']['code'] == 'url_not_allowed'
          PY
      - name: Package developer app for manual desktop validation
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Casting Partner Desktop Proof.app" "$RUNNER_TEMP/casting-desktop-proof.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-proof-not-notarized
          path: ${{ runner.temp }}/casting-desktop-proof.zip
